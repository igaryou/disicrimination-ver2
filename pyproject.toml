[project]
name = "cityscapes-discriminative-baselines"
version = "0.1.0"
description = "Official MMSegmentation discriminative baselines for Cityscapes"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "ftfy>=6.1,<7",
  "mmcv==2.1.0",
  "mmdet==3.3.0",
  "mmengine==0.10.7",
  "mmsegmentation==1.2.2",
  "numpy>=1.24,<2",
  "pillow>=10,<12",
  "regex>=2024.0,<2027",
  "torch==2.1.2",
  "torchvision==0.16.2",
  "wandb>=0.17,<0.20",
]

[tool.uv]
find-links = ["https://download.openmmlab.com/mmcv/dist/cu121/torch2.1/index.html"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
